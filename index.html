<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Zeppelin Museum – AR Cube Test</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

<a-scene
mindar-image="imageTargetSrc: ./target.mind;"
color-space="sRGB"
renderer="colorManagement: true"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false">

<!-- Cube -->
<a-assets>
<a-asset-item
id="cube"
src="./cube.glb">
</a-asset-item>
</a-assets>


<!-- Kamera -->
<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>


<!--
Das Target dient nur zur Erkennung.
Der Cube hängt NICHT darunter.
-->
<a-entity
id="target"
mindar-image-target="targetIndex: 0">
</a-entity>


<!--
Der Cube ist unabhängig vom Target.
Anfangs unsichtbar.
-->
<a-entity
id="model"
gltf-model="#cube"
visible="false"
position="0 0 0"
rotation="0 0 0"
scale="1 1 1">
</a-entity>


<script>

const target = document.querySelector("#target");
const model = document.querySelector("#model");

target.addEventListener("targetFound", () => {

console.log("TARGET GEFUNDEN");

// Transformation des Targets auslesen
const position = target.object3D.getWorldPosition(
new THREE.Vector3()
);

const quaternion = target.object3D.getWorldQuaternion(
new THREE.Quaternion()
);

const scale = target.object3D.getWorldScale(
new THREE.Vector3()
);


// Transformation auf den Cube übertragen
model.object3D.position.copy(position);
model.object3D.quaternion.copy(quaternion);
model.object3D.scale.copy(scale);


// Cube anzeigen
model.setAttribute("visible", "true");

console.log("Cube platziert");
});


target.addEventListener("targetLost", () => {

console.log("TARGET VERLOREN");

/*
ABSICHTLICH NICHT:
model.setAttribute("visible", "false");

Der Cube soll sichtbar bleiben,
auch wenn das Foto nicht mehr erkannt wird.
*/
});

</script>

</a-scene>

</body>
</html>
