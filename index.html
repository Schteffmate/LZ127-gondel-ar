<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Zeppelin Museum – Gondel AR</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body>

<a-scene

mindar-image="
imageTargetSrc: ./target.mind;
maxTrack: 1;
filterMinCF: 0.0001;
filterBeta: 0.001;
"

color-space="sRGB"

renderer="
colorManagement: true;
antialias: true;
"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="enabled: false">


<!-- ================================================= -->
<!-- MODEL -->
<!-- ================================================= -->

<a-assets>

<a-asset-item
id="gondel"
src="./gondel.glb">
</a-asset-item>

</a-assets>


<!-- ================================================= -->
<!-- CAMERA -->
<!-- ================================================= -->

<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>


<!-- ================================================= -->
<!-- IMAGE TARGET -->
<!-- ================================================= -->

<a-entity
mindar-image-target="targetIndex: 0">


<!--
Die Gondel hängt bewusst direkt am Target.
Das ist die stabile Grundfunktion von MindAR.
-->

<a-entity

gltf-model="#gondel"

position="0 0 0"

rotation="0 0 0"

scale="1 1 1">

</a-entity>


</a-entity>


</a-scene>

</body>

</html>
